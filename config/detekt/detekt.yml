# Modus Detekt configuration.
#
# This file is merged ON TOP of Detekt's shipped defaults (buildUponDefaultConfig
# = true in modus.kotlin-base). It therefore records only DELIBERATE deviations,
# and every deviation carries the reason it exists. Do not paste the default
# config dump in here: a stale dump silently freezes the rule set at the version
# it was generated from, which is the opposite of a mechanical gate.
#
# Rules of engagement:
#   * A finding is a build failure. Never raise a threshold to get a branch green.
#   * If a rule is genuinely wrong for Modus, disable it HERE, with a comment
#     saying why. A `@Suppress` at a call site is for the genuinely exceptional
#     case and should be rare enough to notice in review.

build:
  # Zero tolerance. Weighted "budgets" turn a gate into a negotiation.
  maxIssues: 0

config:
  # Fail if this file references a rule that no longer exists, so a Detekt
  # upgrade cannot silently drop a rule we thought we were enforcing.
  validation: true
  warningsAsErrors: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'

comments:
  active: true
  # Deliberately NOT enabling UndocumentedPublic*: Modus documents boundaries and
  # decisions in `documentation/`, not with a KDoc block on every accessor.
  # Explicit API mode already forces the signature to be spelled out.
  AbsentOrWrongFileLicense:
    active: false # Modus carries no per-file licence header.

complexity:
  LongParameterList:
    active: true
    # Constructor injection in adapters and Spring configuration legitimately
    # takes more collaborators than a plain function should.
    functionThreshold: 6
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Autowired', 'Bean']
  TooManyFunctions:
    active: true
    # A domain aggregate with many small behaviours is good design; a service
    # class with many functions is not. Interfaces and data classes are exempt.
    thresholdInClasses: 15
    thresholdInFiles: 20
    ignorePrivate: true
    ignoreOverridden: true
    ignoreDeprecated: true
  LongMethod:
    active: true
    threshold: 40
  CyclomaticComplexMethod:
    active: true
    threshold: 12

exceptions:
  TooGenericExceptionCaught:
    active: true
    # Supervising external processes (Claude Code, git) means genuinely having to
    # catch broadly at the process boundary, but only there.
    excludes: ['**/adapter/agent/**', '**/adapter/vcs/**']
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true

naming:
  FunctionNaming:
    active: true
    # Spring @Bean factory methods and Kotlin type-like factory functions are the
    # accepted exceptions to lowerCamelCase.
    ignoreAnnotated: ['Bean', 'Test', 'ParameterizedTest', 'ArchTest']
  MatchingDeclarationName:
    active: true
  TopLevelPropertyNaming:
    active: true

performance:
  SpreadOperator:
    # SpringApplication.run(cls, *args) is the documented entry point; the array
    # is tiny and allocated once per process.
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  CastToNullableType:
    active: true
  ImplicitDefaultLocale:
    active: true
  LateinitUsage:
    active: true
    # lateinit hides an initialisation order bug until runtime. Tests may use it
    # for fixtures that JUnit assigns in @BeforeEach.
    excludes: ['**/test/**', '**/*Test.kt']

style:
  MaxLineLength:
    active: true
    # Matches max_line_length in .editorconfig; ktlint is the enforcer, this is
    # the backstop for files ktlint does not read.
    maxLineLength: 140
    excludeCommentStatements: false
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1', '2']
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    ignoreEnums: true
    excludes: ['**/test/**', '**/*Test.kt']
  ForbiddenComment:
    active: true
    # TODO/FIXME in main are how intent quietly rots. Track it as a work item in
    # `beans/` instead, where it is visible and assignable.
    comments:
      - reason: 'Track the work in beans/ instead of hiding it in a comment.'
        value: 'TODO:'
      - reason: 'Track the work in beans/ instead of hiding it in a comment.'
        value: 'FIXME:'
      - reason: 'Track the work in beans/ instead of hiding it in a comment.'
        value: 'STOPSHIP:'
    excludes: ['**/test/**']
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  ThrowsCount:
    active: true
    max: 3
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: true
    # Never. .editorconfig sets the IntelliJ star-import threshold to infinity so
    # the IDE cannot introduce one either.
    excludeImports: []
  UseDataClass:
    # Opinionated to the point of being wrong for value objects that need
    # invariants enforced in an init block.
    active: false
  DataClassContainsFunctions:
    # Domain value objects are expected to carry behaviour; that is the point.
    active: false
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Use a structured logger or the execution output stream, not stdout.'
        value: 'kotlin.io.println'
      - reason: 'Use a structured logger or the execution output stream, not stdout.'
        value: 'kotlin.io.print'
      - reason: 'Inject a Clock so time is testable.'
        value: 'java.time.LocalDate.now'
      - reason: 'Inject a Clock so time is testable.'
        value: 'java.time.LocalDateTime.now'
      - reason: 'Inject a Clock so time is testable.'
        value: 'java.time.Instant.now'
