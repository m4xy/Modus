name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # One run per branch; a new push cancels the previous, still-running check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + mechanical gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # This is ONE build on JDK 25, not a JDK matrix.
      #
      # actions/setup-java points JAVA_HOME at the LAST version listed, so the
      # Gradle daemon and every compile task run on 25. JDK 21 is installed
      # solely so the Detekt CLI has a launcher: it embeds a Kotlin frontend
      # that crashes on a JDK 25 JVM (see the comment in
      # build-logic/src/main/kotlin/modus.kotlin-base.gradle.kts). Gradle finds
      # both via org.gradle.java.installations.fromEnv.
      #
      # A matrix was considered and deliberately rejected: the Kotlin toolchain
      # is pinned to 25 in gradle/libs.versions.toml, so a second job with a
      # different launcher JVM would compile with the same toolchain and prove
      # nothing about JDK 21 compatibility. Modus targets one JVM; when that
      # changes, the matrix arrives with the second supported target, not before.
      #
      # Enforcement gap: nothing here exercises the foojay fallback — the path
      #   where no JDK 21 is pre-installed and the toolchain resolver has to
      #   provision one. setup-java always supplies it. Closing condition: the
      #   JDK 21 launcher disappears entirely when Detekt 2.x is stable, which
      #   removes the fallback rather than testing it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The SAME aggregate task CLAUDE.md documents for local use. CI must not
      # run an equivalent-but-different command: the two would drift, and the
      # first anyone would know is a red build nobody can reproduce.
      - name: qualityCheck (compile, test, ktlint, Detekt, ArchUnit, build-logic)
        run: ./gradlew qualityCheck --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
