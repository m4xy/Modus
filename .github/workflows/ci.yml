name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # One run per branch; a new push cancels the previous, still-running check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + mechanical gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # 25 is the project toolchain. 21 is only there for the Detekt CLI, which
      # embeds a Kotlin frontend that cannot run on a JDK 25 JVM — see the
      # comment in build-logic/src/main/kotlin/modus.kotlin-base.gradle.kts.
      # Gradle picks both up via org.gradle.java.installations.fromEnv.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, test, ktlint, Detekt and ArchUnit
        run: ./gradlew build ktlintCheck detekt --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
