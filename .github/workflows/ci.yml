name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  # One run per branch; a new push cancels the previous, still-running check.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The coverage comment, and only that. A fork's GITHUB_TOKEN is read-only
  # regardless, which is why the publish step is guarded on the head repository.
  pull-requests: write

jobs:
  build:
    name: build + mechanical gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # This is ONE build on JDK 25, not a JDK matrix.
      #
      # actions/setup-java points JAVA_HOME at the LAST version listed, so the
      # Gradle daemon and every compile task run on 25. JDK 21 is installed
      # solely so the Detekt CLI has a launcher: it embeds a Kotlin frontend
      # that crashes on a JDK 25 JVM (see the comment in
      # build-logic/src/main/kotlin/modus.kotlin-base.gradle.kts). Gradle finds
      # both via org.gradle.java.installations.fromEnv.
      #
      # A matrix was considered and deliberately rejected: the Kotlin toolchain
      # is pinned to 25 in gradle/libs.versions.toml, so a second job with a
      # different launcher JVM would compile with the same toolchain and prove
      # nothing about JDK 21 compatibility. Modus targets one JVM; when that
      # changes, the matrix arrives with the second supported target, not before.
      #
      # Enforcement gap: nothing here exercises the foojay fallback — the path
      #   where no JDK 21 is pre-installed and the toolchain resolver has to
      #   provision one. setup-java always supplies it. Closing condition: the
      #   JDK 21 launcher disappears entirely when Detekt 2.x is stable, which
      #   removes the fallback rather than testing it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # qualityCheck now reaches backoffice/ and e2e/ through npm (bean:0029), so the
      # runner needs node. Pinned to the major the lockfiles were resolved against;
      # `npm ci` refuses a lockfile it cannot satisfy, so drift fails loudly rather
      # than silently resolving different versions.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backoffice/package-lock.json
            e2e/package-lock.json

      # Pinned to a commit, not a tag. `gradle/actions` is published by the
      # Gradle organisation rather than by GitHub, so `v4` is a tag its
      # publisher can move; this SHA is exactly what `v4` resolves to today.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The SAME aggregate task CLAUDE.md documents for local use. CI must not
      # run an equivalent-but-different command: the two would drift, and the
      # first anyone would know is a red build nobody can reproduce.
      #
      # Both suites are reached through it: `check` depends on `test` and on
      # `integrationTest` in every module (modus.kotlin-base), so there is no
      # second step to forget. See doc:35-testing#source-sets.
      - name: qualityCheck (both suites, ktlint, Detekt, ArchUnit, backoffice, build-logic)
        run: ./gradlew qualityCheck --stacktrace

      # Outside qualityCheck by design (doc:00-constitution §7.2.4): Playwright needs a
      # built and running system and takes minutes. CI can afford that; the fast local
      # gate cannot, and a gate slow enough to skip is a gate nobody runs.
      - name: e2eTest (Playwright end-to-end and accessibility)
        run: |
          npx --prefix e2e playwright install --with-deps chromium
          ./gradlew e2eTest --stacktrace

      # Reporting only, and no second Gradle invocation: qualityCheck already
      # built this XML. The GATE is the per-module ratchet inside qualityCheck,
      # which has already failed the job if coverage moved, so min-coverage-* are
      # 0 rather than a second threshold to keep in sync (doc:35-testing#coverage).
      - name: Publish coverage on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        # Pinned to the immutable commit behind v1.8.0. This is the only
        # third-party action in the workflow and the only reason the job holds
        # `pull-requests: write`; a moving tag would let its publisher run
        # arbitrary code with a write-scoped GITHUB_TOKEN on every pull request.
        # Verify a bump with `gh api repos/madrapps/jacoco-report/commits/<tag>`.
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: build/reports/jacoco/aggregate/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage (all modules, both test suites)
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
