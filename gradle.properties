kotlin.code.style=official

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# `problems=warn` was masking real configuration-cache problems: a build that
# only warns about them is a build that will accumulate them. Left at the
# default (fail) so a new problem stops the build the day it is introduced.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Toolchains are resolved from installed JDKs first and downloaded (via the
# foojay resolver in settings.gradle.kts) only if none matches. On GitHub
# Actions, actions/setup-java exposes each JDK as JAVA_HOME_<version>_<arch>;
# listing them here saves CI from re-downloading a JDK it already has.
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_X64,JAVA_HOME_25_ARM64
